name: build-fun-mod

on:
  push:
    branches:
      - fun-mod-2.0-1.21.11
  pull_request:
    branches:
      - fun-mod-2.0-1.21.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build mod JAR
        run: ./gradlew --no-daemon clean build
      - name: Upload ready-to-use JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fun-Mod-2.0-Minecraft-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
